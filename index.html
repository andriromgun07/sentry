<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentry</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --fg: #e0e0e0;
            --accent: #5b7fff;
            --muted: #6b7280;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--fg);
            font-family: system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        h1 {
            font-size: 3rem;
            letter-spacing: 0.1em;
            color: var(--accent);
        }
        p { color: var(--muted); margin-top: 0.5rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>SENTRY</h1>
        <p>Web project — still building.</p>
        <p class="name">Fathan</p>
    </div>
</body>
</html>
